[tox]
minversion = 2.5.0
isolated_build = True
envlist = qc.sty,qc.cov,qc.sec,py36
#skipsdist = True

[testenv]
usedevelop = True
sitepackages = true

#commands_pre =
 #   apt-get update
  #  apt-get install -y gdal-bin python3-gdal

install_command = pip install -U  {opts} {packages}
commands = pytest --numprocesses=auto --dist=loadscope {posargs}
#whitelist_externals =
 #  mkdir
allowlist_externals =
   mkdir
   apt-get
setenv =
   LC_ALL=C.UTF-8
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_TEST_TIMEOUT=240
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/requirements-test.txt

[testenv:qc.sty]
commands = 
    - flake8 --statistics --tee --output-file={toxinidir}/flake8.log \
    --format=pylint satsr api data tests

# important for Jenkins publishing of results: store results in subdirectory
[testenv:qc.cov]
commands = pytest --cov=satsr --cov-report=html:{toxinidir}/htmlcov --cov-report=term-missing tests

# important for Jenkins publishing of results: store results in subdirectory
[testenv:qc.sec]
commands = 
    mkdir -p {toxinidir}/bandit
    bandit -r satsr -x tests -s B404,B603,B310 -f html -o {toxinidir}/bandit/index.html
